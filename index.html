<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Hypertrophy Log</title>
    
    <!-- PWA & iOS Meta Tags -->
    <!-- The browser bar matches the page canvas in each theme (--canvas in
         src/theme/tokens.css). The manifest in vite.config.js carries the
         light value, for the splash screen. -->
    <meta name="theme-color" content="#F1F2F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HypLog" />
    <!-- iOS ignores SVG touch icons; it needs a PNG (180x180, opaque). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
